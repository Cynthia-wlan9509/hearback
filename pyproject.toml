[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hearback-desk"
dynamic = ["version"]
description = "An agent-native, human-approved bug desk for Discord forum channels."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cynthia-wlan9509 and contributors" }]
keywords = ["discord", "bug-tracker", "forum", "agents", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.19,<3"]
images = ["pillow"]
llm = ["anthropic>=0.40", "openai>=1.50"]
bot = ["discord.py>=2.4"]
keyring = ["keyring>=24"]
all = ["mcp>=1.19,<3", "pillow", "anthropic>=0.40", "openai>=1.50", "discord.py>=2.4", "keyring>=24"]
dev = ["pytest"]

[project.scripts]
hearback = "hearback.cli:main"
swlink = "hearback.web.server:main"

[tool.setuptools]
packages = ["hearback", "hearback.web"]

[tool.setuptools.package-data]
"hearback.web" = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "hearback.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
